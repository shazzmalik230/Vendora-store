<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | BUSYKART</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 { margin-top: 0; }
    p { color: #666; line-height: 1.5; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #16834a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #c62828; }
    .success { color: #16834a; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p>Choose a new password for your BUSYKART admin account.</p>

    <form id="resetForm" hidden>
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="Enter new password"
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="Confirm new password"
      >

      <button id="submitButton" type="submit">
        Update Password
      </button>
    </form>

    <div id="message">Verifying your recovery link...</div>
  </main>

  <script>
    const config = window.VENDORA_CONFIG;
    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || "";
    }

    async function init() {
      try {
        if (!config?.supabaseUrl || !config?.supabasePublishableKey) {
          throw new Error("Supabase configuration is missing.");
        }

        const client = window.supabase.createClient(
          config.supabaseUrl,
          config.supabasePublishableKey
        );

        const url = new URL(window.location.href);
        const queryError = url.searchParams.get("error_description");
        const hashParams = new URLSearchParams(
          url.hash.replace(/^#/, "")
        );
        const hashError = hashParams.get("error_description");

        if (queryError || hashError) {
          throw new Error(
            decodeURIComponent(queryError || hashError).replace(/\+/g, " ")
          );
        }

        const code = url.searchParams.get("code");

        if (code) {
          const { error } = await client.auth.exchangeCodeForSession(code);
          if (error) throw error;
        }

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "Recovery session not found. Request a new password reset email and open its latest link."
          );
        }

        form.hidden = false;
        showMessage("Enter your new password below.", "success");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();

          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password.length < 8) {
            showMessage("Password must be at least 8 characters.", "error");
            return;
          }

          if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
          }

          button.disabled = true;
          button.textContent = "Updating...";

          try {
            const { error: updateError } =
              await client.auth.updateUser({ password });

            if (updateError) throw updateError;

            await client.auth.signOut();

            form.hidden = true;
            showMessage(
              "Password updated successfully. You can now sign in to your BUSYKART admin panel.",
              "success"
            );

          } catch (err) {
            showMessage(err.message || "Unable to update password.", "error");
            button.disabled = false;
            button.textContent = "Update Password";
          }
        });

      } catch (err) {
        showMessage(err.message || "Unable to verify recovery link.", "error");
      }
    }

    init();
  </script>
</body>
</html>
